name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install pinned test tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: Verify source
        shell: pwsh
        run: |
          ./scripts/Invoke-Tests.ps1 -RequirePester -RequireAnalyzer
          ./scripts/Invoke-RepositoryValidation.ps1
      - name: Build release candidate
        shell: pwsh
        run: |
          $version = "0.1.0-ci.${{ github.run_number }}"
          ./scripts/Build-Release.ps1 -Version $version -SkipTests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tunneltend-${{ github.sha }}
          path: |
            artifacts/tunneltend-*.zip
            artifacts/tunneltend-*.zip.sha256
            artifacts/tunneltend-*.manifest.json
          if-no-files-found: error
          retention-days: 14
